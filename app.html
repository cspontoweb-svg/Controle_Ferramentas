<script>
const state={token:sessionStorage.getItem('cf_token')||'',user:null,works:[],fronts:[],equipments:[]};
const $=id=>document.getElementById(id);
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r?.error||'Falha na comunicação'))).withFailureHandler(e=>reject(new Error(e.message||e))).api(action,{...payload,token:state.token}));}
function notice(msg,bad=false){$('notice').textContent=msg;$('notice').classList.remove('hidden','bad');if(bad)$('notice').classList.add('bad');setTimeout(()=>$('notice').classList.add('hidden'),5000);}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userName').textContent=state.user.nome;$('userRole').textContent=state.user.perfil;$('version').textContent='v1.0';document.querySelectorAll('.admin-only').forEach(x=>x.style.display=state.user.perfil==='ADMIN_MASTER'?'block':'none');document.querySelectorAll('.admin-resp').forEach(x=>x.style.display=['ADMIN_MASTER','RESPONSAVEL'].includes(state.user.perfil)?'block':'none');loadAll();}
function showLogin(){ $('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}
async function boot(){if(!state.token)return showLogin();try{state.user=await call('me');showApp();}catch(e){sessionStorage.removeItem('cf_token');state.token='';showLogin();}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await call('login',{email:$('email').value,password:$('password').value});state.token=r.token;sessionStorage.setItem('cf_token',state.token);state.user=r.user;showApp();}catch(err){$('loginError').textContent=err.message;}});
$('logoutBtn').onclick=async()=>{try{await call('logout');}catch(e){}sessionStorage.removeItem('cf_token');state.token='';state.user=null;showLogin();};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
function openPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$('page-'+page).classList.remove('hidden');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('pageTitle').textContent=({dashboard:'Visão geral',equipamentos:'Equipamentos',movimentacoes:'Movimentações',manutencoes:'Manutenções',obras:'Obras e frentes',inventarios:'Inventários',usuarios:'Usuários'})[page];}
async function loadAll(){try{const [d,eq,works,fronts,movs,maint,invs]=await Promise.all([call('dashboard'),call('listEquipments'),call('listWorks'),call('listFronts'),call('listMovements'),call('listMaintenance'),call('listInventory')]);state.equipments=eq;state.works=works;state.fronts=fronts;$('kTotal').textContent=d.total;$('kAvailable').textContent=d.disponiveis;$('kUse').textContent=d.emUso;$('kMaintenance').textContent=d.manutencao;$('kMovements').textContent=d.movimentacoes;$('kOpenMaintenance').textContent=d.manutencoesAbertas;renderEquipments(eq);renderWorks(works);renderFronts(fronts);renderMovements(movs);renderMaintenance(maint);renderInventory(invs);fillSelects();if(state.user.perfil==='ADMIN_MASTER')renderUsers(await call('listUsers'));}catch(e){notice(e.message,true);}}
function renderEquipments(rows){$('equipmentRows').innerHTML=rows.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${esc(r.descricao)}</td><td>${esc(r.categoria)}</td><td>${esc((state.works.find(w=>w.id===r.obra_id)||{}).nome||'—')}</td><td><span class="pill">${esc(r.situacao)}</span></td><td><button class="secondary" onclick="editEquipment('${r.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhum equipamento cadastrado.</td></tr>';}
function fillSelect(id,rows,placeholder='Selecione'){const el=$(id);if(!el)return;const old=el.value;el.innerHTML=`<option value="">${placeholder}</option>`+rows.map(r=>`<option value="${esc(r.id)}">${esc(r.nome||r.descricao||r.codigo)}</option>`).join('');if(rows.some(r=>r.id===old))el.value=old;}
function fillSelects(){fillSelect('eqWork',state.works);fillSelect('eqFront',state.fronts);fillSelect('moveWork',state.works);fillSelect('moveFront',state.fronts);fillSelect('frontWork',state.works);fillSelect('inventoryWork',state.works);fillSelect('inventoryFront',state.fronts);fillSelect('moveEquipment',state.equipments);fillSelect('maintEquipment',state.equipments);}
$('newEquipment').onclick=()=>{clearEquipment();$('equipmentForm').classList.remove('hidden');};
$('cancelEquipment').onclick=()=>$('equipmentForm').classList.add('hidden');
function clearEquipment(){['eqId','eqCode','eqDescription','eqCategory','eqBrand','eqModel','eqSerial','eqAsset','eqLocation','eqNotes'].forEach(id=>$(id).value='');$('eqStatus').value='DISPONIVEL';}
window.editEquipment=id=>{const r=state.equipments.find(x=>x.id===id);if(!r)return;clearEquipment();$('eqId').value=r.id;$('eqCode').value=r.codigo;$('eqDescription').value=r.descricao;$('eqCategory').value=r.categoria;$('eqBrand').value=r.marca;$('eqModel').value=r.modelo;$('eqSerial').value=r.numero_serie;$('eqAsset').value=r.patrimonio;$('eqLocation').value=r.localizacao;$('eqWork').value=r.obra_id;$('eqFront').value=r.frente_id;$('eqStatus').value=r.situacao;$('eqNotes').value=r.observacoes;$('equipmentForm').classList.remove('hidden');};
$('equipmentFormEl').onsubmit=async e=>{e.preventDefault();try{await call('saveEquipment',{item:{id:$('eqId').value||undefined,codigo:$('eqCode').value,descricao:$('eqDescription').value,categoria:$('eqCategory').value,marca:$('eqBrand').value,modelo:$('eqModel').value,numero_serie:$('eqSerial').value,patrimonio:$('eqAsset').value,localizacao:$('eqLocation').value,obra_id:$('eqWork').value,frente_id:$('eqFront').value,situacao:$('eqStatus').value,observacoes:$('eqNotes').value}});$('equipmentForm').classList.add('hidden');await loadAll();notice('Equipamento salvo.');}catch(err){notice(err.message,true);}};
$('equipmentSearch').oninput=()=>{const q=$('equipmentSearch').value.toLowerCase();renderEquipments(state.equipments.filter(r=>[r.codigo,r.descricao,r.patrimonio,r.numero_serie].join(' ').toLowerCase().includes(q)));};
$('movementForm').onsubmit=async e=>{e.preventDefault();try{await call('movement',{item:{equipamento_id:$('moveEquipment').value,tipo:$('moveType').value,destino_obra_id:$('moveWork').value,destino_frente_id:$('moveFront').value,responsavel_recebimento:$('moveReceiver').value,observacao:$('moveNotes').value,chave_idempotencia:crypto.randomUUID()}});e.target.reset();await loadAll();notice('Movimentação registrada.');}catch(err){notice(err.message,true);}};
function renderMovements(rows){$('movementRows').innerHTML=rows.slice().reverse().slice(0,100).map(r=>`<tr><td>${esc(fmtDate(r.data_hora))}</td><td>${esc(r.tipo)}</td><td>${esc((state.equipments.find(x=>x.id===r.equipamento_id)||{}).descricao||r.equipamento_id)}</td><td>${esc(r.usuario_id)}</td><td>${esc(r.observacao)}</td></tr>`).join('')||'<tr><td colspan="5">Sem movimentações.</td></tr>';}
$('maintenanceForm').onsubmit=async e=>{e.preventDefault();try{await call('saveMaintenance',{item:{equipamento_id:$('maintEquipment').value,tipo:$('maintType').value,descricao:$('maintDescription').value,responsavel:$('maintOwner').value,custo:$('maintCost').value,status:$('maintStatus').value,observacao:$('maintNotes').value}});e.target.reset();await loadAll();notice('Manutenção salva.');}catch(err){notice(err.message,true);}};
function renderMaintenance(rows){$('maintenanceRows').innerHTML=rows.slice().reverse().map(r=>`<p><b>${esc(r.descricao)}</b> · ${esc(r.tipo)} · ${esc(r.status)} · custo: ${esc(r.custo)}</p>`).join('')||'<p class="muted">Nenhuma manutenção.</p>';}
$('workForm').onsubmit=async e=>{e.preventDefault();try{await call('saveWork',{item:{nome:$('workName').value,codigo:$('workCode').value,endereco:$('workAddress').value}});e.target.reset();await loadAll();notice('Obra cadastrada.');}catch(err){notice(err.message,true);}};
$('frontForm').onsubmit=async e=>{e.preventDefault();try{await call('saveFront',{item:{obra_id:$('frontWork').value,nome:$('frontName').value}});e.target.reset();await loadAll();notice('Frente cadastrada.');}catch(err){notice(err.message,true);}};
function renderWorks(rows){$('workRows').innerHTML=rows.map(r=>`<p>${esc(r.nome)} <span class="muted">${esc(r.codigo)}</span></p>`).join('')||'<p class="muted">Nenhuma obra.</p>';}
function renderFronts(rows){$('frontRows').innerHTML=rows.map(r=>`<p>${esc(r.nome)} <span class="muted">${esc((state.works.find(w=>w.id===r.obra_id)||{}).nome||'')}</span></p>`).join('')||'<p class="muted">Nenhuma frente.</p>';}
$('inventoryForm').onsubmit=async e=>{e.preventDefault();try{await call('saveInventory',{item:{obra_id:$('inventoryWork').value,frente_id:$('inventoryFront').value,observacao:$('inventoryNotes').value}});e.target.reset();await loadAll();notice('Inventário aberto.');}catch(err){notice(err.message,true);}};
function renderInventory(rows){$('inventoryRows').innerHTML=rows.slice().reverse().map(r=>`<p>Inventário ${esc(r.id)} · ${esc(r.status)} · ${esc(r.data_inicio)}</p>`).join('')||'<p class="muted">Nenhum inventário.</p>';}
$('userForm').onsubmit=async e=>{e.preventDefault();try{await call('createUser',{item:{nome:$('userNewName').value,email:$('userNewEmail').value,password:$('userNewPassword').value,perfil:$('userNewRole').value}});e.target.reset();renderUsers(await call('listUsers'));notice('Usuário criado.');}catch(err){notice(err.message,true);}};
function renderUsers(rows){$('userRows').innerHTML=rows.map(r=>`<p>${esc(r.nome)} · ${esc(r.email)} · <span class="pill">${esc(r.perfil)}</span></p>`).join('');}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('pt-BR');}
boot();
</script>
